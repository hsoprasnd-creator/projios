name: Build PUBG ESP Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download and install iOS SDK
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS/sdks
          # Git clone use kar rahe hain taaki LFS / tar format ka koi chakkar hi na rahe
          sudo git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          sudo cp -r /tmp/theos-sdks/*.sdk $THEOS/sdks/
          ls -la $THEOS/sdks/

      - name: Auto-adjust Makefile SDK version
        run: |
          # Makefile ke andar SDK version check karke adjust kar lo
          sed -i '' 's/iphone:clang:14.5:14.0/iphone:clang:15.0:14.0/' Makefile || true
          cat Makefile

      - name: Build tweak
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make package

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-esp-deb
          path: packages/*.deb
