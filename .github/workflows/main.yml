name: Build PUBG ESP Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download and install iOS SDK
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS/sdks
          sudo git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          sudo cp -r /tmp/ios-sdks/*.sdk $THEOS/sdks/
          ls -la $THEOS/sdks/

      - name: Auto-detect and set Makefile SDK version
        run: |
          SDK_DIR=$(ls -d /opt/theos/sdks/iPhoneOS*.sdk | head -n 1 | xargs basename | sed 's/\.sdk//')
          echo "Found SDK: $SDK_DIR"
          
          VERSION=${SDK_DIR#iPhoneOS}
          echo "Setting Makefile SDK version to: $VERSION"
          
          if [ -f "Makefile" ]; then
            sed -i '' "s/iphone:clang:.*:.*/iphone:clang:$VERSION:14.0/g" Makefile
            cat Makefile
          else
            echo "Makefile not found!"
            exit 1
          fi

      - name: Build tweak
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make package

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-esp-deb
          path: packages/*.deb
