name: Build PUBG ESP Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download and install iOS 15.0 SDK
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS/sdks
          
          # Directly pull the SDK repo and target iPhoneOS15.0 to avoid old SDKs like 10.3
          sudo git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks
          if [ -d "/tmp/ios-sdks/iPhoneOS15.0.sdk" ]; then
            sudo cp -r /tmp/ios-sdks/iPhoneOS15.0.sdk $THEOS/sdks/
          else
            sudo cp -r /tmp/ios-sdks/*.sdk $THEOS/sdks/ || true
          fi

          echo "Installed SDKs:"
          ls -la $THEOS/sdks/

      - name: Force Makefile SDK version to 15.0
        run: |
          if [ -f "Makefile" ]; then
            # Hardcode 15.0 so it never accidentally picks an outdated SDK
            sed -i '' 's/iphone:clang:.*:.*/iphone:clang:15.0:14.0/g' Makefile
            cat Makefile
          else
            echo "Makefile not found!"
            exit 1
          fi

      - name: Build tweak
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make package

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-esp-deb
          path: packages/*.deb
