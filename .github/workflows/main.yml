name: Build PUBG ESP Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download and install iOS 15.0 SDK
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS/sdks
          sudo rm -rf $THEOS/sdks/*
          
          # Stable iPhoneOS 15.0 SDK download kar rahe hain jo modules error nahi deta
          sudo curl -L -o /tmp/iPhoneOS15.0.sdk.tar.xz https://github.com/xybp888/iOS-SDKs/raw/master/iPhoneOS15.0.sdk.tar.xz
          sudo tar -xf /tmp/iPhoneOS15.0.sdk.tar.xz -C $THEOS/sdks/
          
          ls -la $THEOS/sdks/

      - name: Force Makefile SDK version to 15.0
        run: |
          if [ -f "Makefile" ]; then
            sed -i '' 's/iphone:clang:.*:.*/iphone:clang:15.0:14.0/g' Makefile
            cat Makefile
          else
            echo "Makefile not found!"
            exit 1
          fi

      - name: Build tweak
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make package

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-esp-deb
          path: packages/*.deb
