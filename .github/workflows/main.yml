name: Build PUBG ESP Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download and install iOS SDK
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS/sdks
          
          # Direct stable repo clone taaki 100% koi ek SDK folder mil jaye
          sudo git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          sudo cp -r /tmp/theos-sdks/* $THEOS/sdks/ || true
          
          # Agar phir bhi koi SDK na ho toh fallback download
          if [ -z "$(ls -A $THEOS/sdks/)" ]; then
            sudo curl -L -o /tmp/sdk.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
            sudo unzip -q /tmp/sdk.zip -d /tmp/
            sudo cp -r /tmp/sdks-master/* $THEOS/sdks/ || true
          fi
          
          echo "Installed SDKs:"
          ls -la $THEOS/sdks/

      - name: Auto-detect and fix Makefile SDK version
        run: |
          # Theos sdks folder ke andar jo bhi SDK folder mila hai uska naam pata karo
          SDK_DIR=$(ls -d /opt/theos/sdks/*.sdk | head -n 1 | xargs basename | sed 's/\.sdk//')
          echo "Found SDK: $SDK_DIR"
          
          # Makefile ke andar SDK version ko automatically update kar do jo folder available hai
          if [ -f "Makefile" ]; then
            sed -i '' "s/iphone:clang:.*:.*/iphone:clang:${SDK_DIR#iPhoneOS}:14.0/g" Makefile || true
            cat Makefile
          else
            echo "Makefile not found!"
            exit 1
          fi

      - name: Build tweak
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make package

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-esp-deb
          path: packages/*.deb
