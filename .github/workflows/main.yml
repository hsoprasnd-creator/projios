name: Build PUBG ESP Dylib

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download and install iOS SDK
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS/sdks
          
          # Sirf iPhoneOS 15.0 SDK direct download kar rahe hain taaki koi dusri TV/Watch SDK beech mein na aaye
          sudo curl -L -o /tmp/iPhoneOS15.0.sdk.tar.xz https://github.com/theos/sdks/raw/master/iPhoneOS15.0.sdk.tar.xz || true
          
          # Agar tar.xz fail ho toh direct git se iPhoneOS15.0 folder clone karenge
          if [ ! -d "$THEOS/sdks/iPhoneOS15.0.sdk" ]; then
            sudo git clone --depth=1 https://github.com/xybp888/iOS-SDKs.git /tmp/ios-sdks || true
            if [ -d "/tmp/ios-sdks" ]; then
              sudo cp -r /tmp/ios-sdks/*.sdk $THEOS/sdks/ || true
            fi
          fi
          
          # Agar phir bhi na aaye toh theos sdks repo se sirf iPhoneOS wali copy karo
          if [ ! -d "$THEOS/sdks/iPhoneOS15.0.sdk" ]; then
            sudo git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks || true
            sudo cp -r /tmp/theos-sdks/iPhoneOS*.sdk $THEOS/sdks/ || true
          fi

          echo "Final Installed SDKs:"
          ls -la $THEOS/sdks/

      - name: Auto-detect and fix Makefile SDK version
        run: |
          # Sirf iPhoneOS SDK ko filter karke version nikalenge
          SDK_DIR=$(ls -d /opt/theos/sdks/iPhoneOS*.sdk | head -n 1 | xargs basename | sed 's/\.sdk//')
          echo "Found iPhone SDK: $SDK_DIR"
          
          if [ -z "$SDK_DIR" ]; then
            echo "Error: No iPhoneOS SDK found!"
            exit 1
          fi
          
          VERSION=${SDK_DIR#iPhoneOS}
          echo "Setting Makefile SDK version to: $VERSION"
          
          if [ -f "Makefile" ]; then
            sed -i '' "s/iphone:clang:.*:.*/iphone:clang:$VERSION:14.0/g" Makefile || true
            cat Makefile
          else
            echo "Makefile not found!"
            exit 1
          fi

      - name: Build tweak
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make package

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-esp-deb
          path: packages/*.deb
