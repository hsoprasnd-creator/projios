name: Build iOS Tweak (Dylib)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Theos
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download and install iOS SDK
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS/sdks
          # Download iOS 15.0 SDK from Theos SDK repository
          sudo curl -L -o /tmp/iPhoneOS15.0.sdk.tar.xz https://github.com/theos/sdks/raw/master/iPhoneOS15.0.sdk.tar.xz
          sudo tar -xf /tmp/iPhoneOS15.0.sdk.tar.xz -C $THEOS/sdks/
          ls -la $THEOS/sdks/

      - name: Build tweak
        run: |
          export THEOS=/opt/theos
          export PATH=$THEOS/bin:$PATH
          make package

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubg-esp-deb
          path: packages/*.deb
